<script>
  /* Open collapsed sections (<details>) when a link points to one.
     Works for links to the section's id, or to anything inside it,
     from the same page or another page. Also opens any sections it is nested in. */
  (function () {
    function openTarget() {
      var id = decodeURIComponent(location.hash.slice(1));
      if (!id) return;
      var target = document.getElementById(id);
      if (!target) return;

      var opened = false;
      var section = target.tagName === 'DETAILS' ? target : target.closest('details');
      while (section) {
        if (!section.open) {
          section.open = true;
          opened = true;
        }
        section = section.parentElement ? section.parentElement.closest('details') : null;
      }
      if (opened) target.scrollIntoView();
    }

    document.addEventListener('DOMContentLoaded', openTarget);
    window.addEventListener('hashchange', openTarget);

    /* Clicking a link to the section you're already on (for example after
       closing it) doesn't change the address, so check again after any click. */
    document.addEventListener('click', function (e) {
      var link = e.target.closest('a[href*="#"]');
      if (link && link.pathname === location.pathname) setTimeout(openTarget, 0);
    });
  })();
</script>
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('jtd-theme'); } catch (e) {}
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if ((stored || (prefersDark ? 'dark' : 'light')) === 'dark') {
      jtd.setTheme('dark');
    }
  })();
</script>
