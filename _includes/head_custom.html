<script>
  /* Dark mode: if the reader chose dark on an earlier visit, switch the stylesheet
     now, before the page is drawn, so they don't see a flash of the light theme.
     The toggle button itself is in _includes/theme_toggle.html. */
  try {
    if (localStorage.getItem('theme') === 'dark') jtd.setTheme('dark');
  } catch (e) {}
</script>

<script>
  /* Open collapsed sections (<details>) when a link points to one.
     Works for links to the section's id, or to anything inside it,
     from the same page or another page. Also opens any sections it is nested in. */
  (function () {
    function openTarget() {
      var id = decodeURIComponent(location.hash.slice(1));
      if (!id) return;
      var target = document.getElementById(id);
      if (!target) return;

      var opened = false;
      var section = target.tagName === 'DETAILS' ? target : target.closest('details');
      while (section) {
        if (!section.open) {
          section.open = true;
          opened = true;
        }
        section = section.parentElement ? section.parentElement.closest('details') : null;
      }
      if (opened) target.scrollIntoView();
    }

    document.addEventListener('DOMContentLoaded', openTarget);
    window.addEventListener('hashchange', openTarget);

    /* Clicking a link to the section you're already on (for example after
       closing it) doesn't change the address, so check again after any click. */
    document.addEventListener('click', function (e) {
      var link = e.target.closest('a[href*="#"]');
      if (link && link.pathname === location.pathname) setTimeout(openTarget, 0);
    });
  })();
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Normalize paths so /page/, /page.html and /page/index.html all match
  function norm(p) { return p.replace(/(index)?\.html$/, "").replace(/\/$/, ""); }
  var here = norm(window.location.pathname);

  // The theme marks the current page's link "active" (and removes its href),
  // so find it by class, falling back to matching the address.
  var link = document.querySelector("#site-nav a.nav-list-link.active") ||
    Array.from(document.querySelectorAll("#site-nav a.nav-list-link[href]"))
      .find(function (a) { return norm(new URL(a.href).pathname) === here; });
  if (!link) return;

  // h2s in the page body, skipping any marked {: .no_toc }
  var headings = document.querySelectorAll("#main-content h2[id]:not(.no_toc)");
  if (!headings.length) return;

  var list = document.createElement("ul");
  list.className = "nav-list nav-headings";
  headings.forEach(function (h) {
    var li = document.createElement("li");
    li.className = "nav-list-item";
    var a = document.createElement("a");
    a.className = "nav-list-link";
    a.href = "#" + h.id;
    a.textContent = h.textContent.trim();
    li.appendChild(a);
    list.appendChild(li);
  });

  // Put headings under the current page, ahead of any child pages
  var item = link.closest(".nav-list-item");
  item.insertBefore(list, item.querySelector(":scope > .nav-list"));
});
</script>
