<!--
  "On this page" and "Back to top" buttons. Included from footer_custom.html.
  Styles are in _sass/custom/custom.scss (search for "Page navigation buttons").

  - Without JavaScript, "Back to top" is a plain link at the end of the page.
  - With JavaScript, the buttons float at the bottom of the screen once you start
    scrolling: beside the content column on wide screens, otherwise in the
    bottom-right corner. On short screens (or at high zoom) they stay at the end
    of the page instead.
  - "On this page" copies the page's own "On this page" list into a popover, so
    there's nothing extra to maintain. Pages without a list, and browsers without
    popovers, only get "Back to top".
-->
<div class="page-nav" id="page-nav">
  <button type="button" class="page-nav-button" popovertarget="page-toc" hidden>On this page</button>
  <div class="page-toc" id="page-toc" popover hidden>
    <nav aria-labelledby="page-toc-title">
      <p class="page-toc-title" id="page-toc-title">On this page</p>
    </nav>
  </div>
  <a class="page-nav-button" href="#top">Back to top</a>
</div>

<script>
  (function () {
    var bar = document.getElementById('page-nav');
    var button = bar.querySelector('button');
    var popover = document.getElementById('page-toc');

    /* The page's own "On this page" list: a paragraph that says "On this page",
       followed by a list */
    var label = Array.prototype.find.call(document.querySelectorAll('.main-content p'), function (p) {
      var next = p.nextElementSibling;
      return next && /^[OU]L$/.test(next.tagName) && /^\s*On this page:?\s*$/i.test(p.textContent);
    });
    var hasToc = Boolean(label) && 'popover' in HTMLElement.prototype;

    if (hasToc) {
      popover.querySelector('nav').appendChild(label.nextElementSibling.cloneNode(true));
      button.hidden = popover.hidden = false;
      /* Choosing a link closes the popover; the page then jumps to that section */
      popover.addEventListener('click', function (e) {
        if (e.target.closest('a')) popover.hidePopover();
      });
      popover.addEventListener('toggle', update);
    } else {
      button.remove();
      popover.remove();
    }

    /* Float the bar (custom.scss decides whether the screen is tall enough),
       and show it once the page has scrolled */
    document.documentElement.classList.add('page-nav-floating');

    function update() {
      var floating = getComputedStyle(bar).position === 'fixed';
      var show = !floating || window.scrollY > 0 || (hasToc && popover.matches(':popover-open'));
      bar.classList.toggle('is-visible', show);
      /* Hidden buttons shouldn't be reachable with Tab or by screen readers */
      bar.toggleAttribute('inert', !show);
    }

    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();
</script>
