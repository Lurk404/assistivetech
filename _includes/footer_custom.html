{% include page_nav_buttons.html %}

<script>
  /* External links open in a new tab, with an icon and screen reader text that
     say so. The icon's styles are in custom.scss (search for "External links");
     .sr-only is Just the Docs' screen-reader-only class. Image links are skipped. */
  (function () {
    var icon =
      '<svg class="ext-link-icon" viewBox="0 0 12 12" aria-hidden="true" focusable="false" ' +
      'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M5 2H2.5a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1V7"/>' +
        '<path d="M6 6l4.5-4.5"/>' +
        '<path d="M7 1.5h3.5V5"/>' +
      '</svg><span class="sr-only"> (opens in new tab)</span>';

    document.querySelectorAll('.main-content a[href^="http"]').forEach(function (a) {
      if (a.hostname === location.hostname || a.querySelector('img')) return;
      a.target = '_blank';   /* browsers add rel="noopener" for new tabs themselves */

      /* The icon goes in a no-wrap span with the link's last word, so it can't
         end up alone on the next line. The word joiner (U+2060) after it keeps
         a full stop or comma after the link on the same line too. */
      var end = document.createElement('span');
      end.className = 'ext-link-end';
      var text = a.lastChild;
      if (text && text.nodeType === Node.TEXT_NODE) {
        var i = text.data.search(/\S+\s*$/);
        if (i >= 0) {
          end.textContent = text.data.slice(i);
          text.data = text.data.slice(0, i);
        }
      }
      end.insertAdjacentHTML('beforeend', icon);
      a.append(end, '⁠');
    });
  })();
</script>
