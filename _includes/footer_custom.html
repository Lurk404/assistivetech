<style>
  /* External link icon: small, superscript, matches link colour */
  .ext-link-icon {
    display: inline-block;
    width: 0.7em;
    height: 0.7em;
    margin-left: 0.15em;
    vertical-align: super;
  }
  /* Screen-reader-only text */
  .ext-link-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>

<script>
  (function () {
    var icon =
      '<svg class="ext-link-icon" viewBox="0 0 12 12" aria-hidden="true" focusable="false" ' +
      'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M5 2H2.5a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1V7"/>' +
        '<path d="M6 6l4.5-4.5"/>' +
        '<path d="M7 1.5h3.5V5"/>' +
      '</svg>';

    document.querySelectorAll('.main-content a[href^="http"]').forEach(function (a) {
      if (a.hostname === location.hostname) return; // internal link: leave alone
      if (a.querySelector('img')) return;           // skip image links

      a.target = '_blank';
      a.rel = 'noopener';
      a.insertAdjacentHTML('beforeend',
        icon + '<span class="ext-link-sr"> (opens in new tab)</span>');
    });
  })();
</script>
