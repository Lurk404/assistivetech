<!--
  Light/dark toggle, at the top of the display preferences panel, next to "Reset".
  Included from display_preferences.html, whose script moves it into the panel
  (it stays in the header if the panel can't load). It uses the .page-nav-button
  style, like the other buttons.

  - Light is the default. Dark is the reader's choice, remembered in their
    browser (localStorage) so it carries over from page to page.
  - head_custom.html re-applies a saved dark choice before the page is drawn.
  - The visible label names the mode the button switches to ("Dark" or "Light").
    Screen readers hear "Switch to dark mode" / "Switch to light mode", which still
    contains the visible word, so voice control ("click Dark") works too.
  - The button stays hidden if JavaScript is off, since it can't work without it.
-->
<button type="button" class="page-nav-button" id="theme-toggle" hidden>Dark</button>

<script>
  (function () {
    var button = document.getElementById('theme-toggle');
    if (!window.jtd) return;

    function updateLabel() {
      var next = jtd.getTheme() === 'dark' ? 'Light' : 'Dark';
      button.textContent = next;
      button.setAttribute('aria-label', 'Switch to ' + next.toLowerCase() + ' mode');
    }

    button.addEventListener('click', function () {
      var dark = jtd.getTheme() !== 'dark';
      jtd.setTheme(dark ? 'dark' : 'default');   /* "default" is the site's light theme */
      try {
        if (dark) localStorage.setItem('theme', 'dark');
        else localStorage.removeItem('theme');
      } catch (e) {}
      updateLabel();
    });

    updateLabel();
    button.hidden = false;
  })();
</script>
