<button type="button" class="btn js-theme-toggle" aria-pressed="false">Dark mode</button>

<script>
  (function () {
    var btn = document.querySelector('.js-theme-toggle');
    var media = window.matchMedia('(prefers-color-scheme: dark)');

    function sync() {
      btn.setAttribute('aria-pressed', jtd.getTheme() === 'dark' ? 'true' : 'false');
    }

    function stored() {
      try { return localStorage.getItem('jtd-theme'); } catch (e) { return null; }
    }

    btn.addEventListener('click', function () {
      var next = jtd.getTheme() === 'dark' ? 'light' : 'dark';
      jtd.setTheme(next);
      try { localStorage.setItem('jtd-theme', next); } catch (e) {}
      sync();
    });

    // Follow device changes until the user makes their own choice
    media.addEventListener('change', function (e) {
      if (!stored()) {
        jtd.setTheme(e.matches ? 'dark' : 'light');
        sync();
      }
    });

    sync();
  })();
</script>
