<!--
  Display preferences (Fluid Infusion UI Options): a "Show preferences" button in
  the header, and a panel that opens just below the header. The top of the panel
  has Previous / Next on the left, for the settings cards, which sit in one row,
  and the light/dark toggle (_includes/theme_toggle.html) and "Reset" on the right.
  Included from header_custom.html. Styles and the Infusion script are loaded in
  head_custom.html; the layout is in _sass/custom/custom.scss (search for
  "Display preferences"). The Infusion files are in assets/infusion/.

  - Readers can change text size, font, line, letter and word spacing, colour
    contrast, make buttons and form fields bigger, and turn on text-to-speech.
    The choices apply to every page and are remembered in a browser cookie.
  - Text-to-speech uses the voices built into the reader's browser. When it's on,
    a play button appears at the top of the page content and reads the page
    (the <main> element, not the menus or footer), and a small play button
    appears next to any text the reader selects. Collapsed sections are skipped
    until they're opened.
  - Infusion needs the buttons and the panel inside one container, so the script
    below wraps the whole header in that container and adds the panel after it.
    The header itself doesn't change.
  - On phones the header (search, these buttons, the light/dark toggle) is inside
    the menu, so readers open the menu to find "Show preferences".
  - The panels themselves (templates and wording) are only downloaded the first
    time someone opens the panel ("lazyLoad").
  - The buttons stay hidden if JavaScript is off, since they can't work without it.
  - Button wording: screen readers hear "Show preferences" / "Hide preferences"
    (without the + and −), which matches the visible words, so voice control
    ("click Show preferences", "click Reset") works.
-->
<div class="site-prefs-buttons" id="site-prefs-buttons" hidden>
  <button type="button" class="page-nav-button flc-slidingPanel-toggleButton">+ Show preferences</button>
</div>

<!--
  Hidden until the script below moves it into the top of the panel: Previous /
  Next on the left, to move through the settings cards (they sit in one row),
  and light/dark and Reset on the right.
  Previous / Next show a large ‹ / › only, so the row stays on one line on
  phones. Screen readers hear "Previous" / "Next" (hidden text, not the
  arrows), voice control works with "click Previous" / "click Next", and
  hovering shows the same words. After a press, screen readers also hear
  which settings are now showing.
-->
<div class="site-prefs-toolbar" id="site-prefs-toolbar" hidden>
  <div class="site-prefs-pager" id="site-prefs-pager" hidden>
    <button type="button" class="page-nav-button site-prefs-pager__prev" title="Previous" aria-disabled="true"><svg class="site-prefs-pager__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="site-prefs-sr">Previous</span></button>
    <span class="site-prefs-pager__status"></span>
    <button type="button" class="page-nav-button site-prefs-pager__next" title="Next"><svg class="site-prefs-pager__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="site-prefs-sr">Next</span></button>
    <span class="site-prefs-sr site-prefs-pager__live" role="status"></span>
  </div>
  <div class="site-prefs-toolbar__end">
    {% include theme_toggle.html %}
    <button type="button" class="page-nav-button flc-prefsEditor-reset" aria-label="Reset preferences">Reset</button>
  </div>
</div>

<script>
  (function () {
    function start() {
      var buttons = document.getElementById('site-prefs-buttons');
      var toolbar = document.getElementById('site-prefs-toolbar');
      var header = document.getElementById('main-header');
      if (!buttons || !toolbar || !header || !window.fluid || !fluid.uiOptions) {
        /* Infusion didn't load: leave the light/dark toggle in the header,
           and remove Previous / Next and "Reset", which can't work without it */
        if (toolbar) {
          toolbar.querySelectorAll('#site-prefs-pager, .flc-prefsEditor-reset').forEach(function (el) { el.remove(); });
          toolbar.hidden = false;
        }
        return;
      }

      /* Container: wraps the header, with the panel right after it */
      var prefs = document.createElement('div');
      prefs.id = 'site-prefs';
      prefs.className = 'site-prefs flc-prefsEditor-separatedPanel fl-prefsEditor-separatedPanel';
      var panel = document.createElement('div');
      panel.className = 'flc-slidingPanel-panel';
            /* Start closed. Infusion closes the panel when it starts, but with a
         sliding animation, a moment after the page appears, so without this
         the open panel would flash on screen and then slide shut. */
      panel.style.display = 'none';

      header.parentNode.insertBefore(prefs, header);
      prefs.appendChild(header);
      prefs.appendChild(panel);
      /* Light/dark and Reset go at the top of the panel. Infusion adds the
         preference cards after them when the panel first opens. */
      panel.appendChild(toolbar);
      toolbar.hidden = false;
      buttons.hidden = false;

      /* The panel uses two fonts the rest of the site doesn't. Fetch them as
         soon as someone heads for "Show preferences", so they've arrived before
         the panel opens and don't change its height while it slides. */
      var showButton = buttons.querySelector('.flc-slidingPanel-toggleButton');
      if (showButton && document.fonts) {
        var warmFonts = function () {
          document.fonts.load('1em "Open Sans Variable"');
          document.fonts.load('1em "PrefsFramework-Icons"');
        };
        ['pointerenter', 'focus', 'touchstart'].forEach(function (type) {
          showButton.addEventListener(type, warmFonts, { once: true, passive: true });
        });
      }

      /* Tab order: on wider screens, put the header (search, Show preferences,
         View on GitHub) before the sidebar in the page, so keyboard
         users reach it before the menu. It looks the same: the sidebar is fixed
         to the left there, and custom.scss lines the header up with the content.
         On phones it stays where Just the Docs puts it, inside the menu.
         (50rem matches Just the Docs' "md" breakpoint.) */
      var sidebar = document.querySelector('.side-bar');
      var mainCol = document.querySelector('.main');
      var wide = window.matchMedia('(min-width: 50rem)');
      function place() {
        if (wide.matches && sidebar) {
          document.body.insertBefore(prefs, sidebar);
          prefs.classList.add('site-prefs-top');
        } else if (mainCol) {
          mainCol.insertBefore(prefs, mainCol.firstChild);
          prefs.classList.remove('site-prefs-top');
        }
      }
      place();
      if (wide.addEventListener) wide.addEventListener('change', place);

      /* Text-to-speech: read the page's <main>, and put the play button
         at the top of the page content */
      var content = document.querySelector('.main-content');
      var main = document.querySelector('.main-content main');
      if (content && main) {
        content.classList.add('flc-prefs-selfVoicingWidget');
        main.classList.add('flc-orator-content');
      }

      /* Extra contrast theme: dark brown on sand (#F9F5E9), second in the list.
         Its colours are in custom.scss (search for "fl-theme-sand"), and its name
         ("Dark brown on sand") is in assets/display-preferences/contrast.json. */
      fluid.defaults("fluid.prefs.schemas.contrast", {
        gradeNames: ["fluid.prefs.schemas"],
        schema: {
          "fluid.prefs.contrast": {
            "type": "string",
            "default": "default",
            "enum": ["default", "sand", "bw", "wb", "by", "yb", "lgdg", "gw", "gd", "bbr"],
            "enumLabels": ["contrast-default", "contrast-sand", "contrast-bw", "contrast-wb",
              "contrast-by", "contrast-yb", "contrast-lgdg", "contrast-gw", "contrast-gd", "contrast-bbr"]
          }
        }
      });

      /* Infusion scrolls back to the first card on Reset, but measures from the
         edge of the page rather than the row of cards, so with the row beside
         the sidebar it lands in the wrong place. Measure from the first card. */
      fluid.prefs.arrowScrolling.scrollToPanel = function (that, index) {
        var cards = that.locate('panels');
        var scroller = that.locate('scrollContainer')[0];
        var card = cards[index || 0];
        if (scroller && card && card.offsetWidth) scroller.scrollLeft = card.offsetLeft - cards[0].offsetLeft;
      };

      fluid.uiOptions(prefs, {
        listeners: {
          onPrefsEditorReady: function () { settingsPager(prefs); }   /* the cards are drawn (first time the panel opens) */
        },
        /* The panels, in order. Infusion also offers "fluid.prefs.tableOfContents",
           left out because every guide already has its own "On this page" list. */
        preferences: [
          "fluid.prefs.textSize",
          "fluid.prefs.textFont",
          "fluid.prefs.lineSpace",
          "fluid.prefs.letterSpace",
          "fluid.prefs.wordSpace",
          "fluid.prefs.contrast",
          "fluid.prefs.enhanceInputs",
          "fluid.prefs.speak"
        ],
        auxiliarySchema: {
          terms: {
            /* Paths include the site's address (/assistivetech), so they work on every page */
            templatePrefix: "{{ '/assets/infusion/src/framework/preferences/html' | relative_url }}",
            messagePrefix: "{{ '/assets/infusion/src/framework/preferences/messages' | relative_url }}"
          },
          /* The sand theme (see above): its class, and the wording file with its name */
          "fluid.prefs.contrast": {
            enactor: {
              classes: { "sand": "fl-theme-sand" }
            },
            panel: {
              classnameMap: { theme: { "sand": "fl-theme-sand" } },
              message: "{{ '/assets/display-preferences/contrast.json' | relative_url }}"
            }
          },
          /* Text-to-speech play button: clearer names than Infusion's "play" / "pause" */
          "fluid.prefs.speak": {
            enactor: {
              orator: {
                controller: {
                  strings: { play: "Read this page aloud", pause: "Pause reading" }
                }
              }
            }
          }
        },
        prefsEditorLoader: {
          lazyLoad: true,
          slidingPanel: {
            animationDurations: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? { show: 0, hide: 0 } : { show: 400, hide: 400 },
            strings: {
              showText: "+ Show preferences",
              hideText: "− Hide preferences",
              showTextAriaLabel: "Show preferences",
              hideTextAriaLabel: "Hide preferences",
              panelLabel: "Display preferences"
            }
          }
        }
      });
    }

    /* Previous / Next for the settings cards (layout in custom.scss, "Settings
       cards in one row").
       - Shows as many cards as fit at least 15rem wide, up to 3. Bigger text
         (the Text size setting) means fewer cards per view.
       - Previous / Next move a whole view at a time. At either end the button
         stays focusable but does nothing (aria-disabled), so keyboard focus
         isn't lost.
       - Tabbing into a card that's out of view brings the whole card into
         view, so every setting is reachable with Tab alone.
       - Swiping or trackpad scrolling works too; the cards snap into place.
       - After a press, screen readers hear which settings are showing. */
    function settingsPager(prefs) {
      var pager = document.getElementById('site-prefs-pager');
      var scroller = prefs.querySelector('.flc-prefsEditor-scrollContainer');
      var list = scroller && scroller.querySelector('.fl-prefsEditor-panels');
      var cards = list ? list.querySelectorAll('.fl-prefsEditor-panel') : [];
      if (!pager || !cards.length) return;

      var prev = pager.querySelector('.site-prefs-pager__prev');
      var next = pager.querySelector('.site-prefs-pager__next');
      var status = pager.querySelector('.site-prefs-pager__status');
      var live = pager.querySelector('.site-prefs-pager__live');
      var total = cards.length;
      var perView = 1;

      if (scroller.id) {
        prev.setAttribute('aria-controls', scroller.id);
        next.setAttribute('aria-controls', scroller.id);
      }

      function px(el, prop) { return parseFloat(getComputedStyle(el)[prop]) || 0; }

      /* How many cards fit, at the current text size */
      function fit() {
        var gap = px(list, 'columnGap');
        /* While the panel is closed the row has no width, so use the width it
           will have when it opens: the container's. (Using 0 would squeeze in
           1 card, and the panel would open to the wrong height, then jump.) */
        var width = list.clientWidth || prefs.clientWidth;
        var room = width - px(list, 'paddingLeft') - px(list, 'paddingRight');
        var min = 15 * px(document.documentElement, 'fontSize');
        perView = Math.max(1, Math.min(3, Math.floor((room + gap) / (min + gap))));
        list.style.setProperty('--per-view', perView);
      }

      /* Where each card starts, measured from the first card */
      function start(i) { return cards[i].offsetLeft - cards[0].offsetLeft; }

      /* The first card in view: the one whose start is closest */
      function first() {
        var best = 0;
        for (var i = 1; i < total; i++) {
          if (Math.abs(start(i) - scroller.scrollLeft) < Math.abs(start(best) - scroller.scrollLeft)) best = i;
        }
        return best;
      }

      function describe(f) {
        var last = Math.min(f + perView, total);
        return (perView === 1 || f + 1 === last ? (f + 1) : (f + 1) + '–' + last) + ' of ' + total;
      }

      function update() {
        var f = first();
        status.textContent = describe(f);
        prev.setAttribute('aria-disabled', String(f <= 0));
        next.setAttribute('aria-disabled', String(f + perView >= total));
      }

      function go(direction) {
        var button = direction < 0 ? prev : next;
        if (button.getAttribute('aria-disabled') === 'true') return;
        var target = Math.max(0, Math.min(total - perView, first() + direction * perView));
        var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        scroller.scrollTo({ left: start(target), behavior: smooth ? 'smooth' : 'auto' });
        live.textContent = 'Showing settings ' + describe(target).replace('–', ' to ');
      }

      prev.addEventListener('click', function () { go(-1); });
      next.addEventListener('click', function () { go(1); });

      /* Tabbing into a card that's partly or wholly out of view: the browser
         only scrolls far enough to show the focused control, so line up the
         whole card instead (and keep "1–3 of 8" right) */
      scroller.addEventListener('focusin', function (e) {
        var card = e.target.closest('.fl-prefsEditor-panel');
        if (!card) return;
        var i = Array.prototype.indexOf.call(cards, card);
        var box = card.getBoundingClientRect();
        var view = scroller.getBoundingClientRect();
        var pad = px(list, 'paddingLeft');
        var target = null;
        if (box.left < view.left + pad - 1) target = i;
        else if (box.right > view.right - pad + 1) target = i - perView + 1;
        if (target !== null) {
          scroller.scrollLeft = start(Math.max(0, Math.min(total - perView, target)));
        }
        update();
      });

      var queued = false;
      scroller.addEventListener('scroll', function () {
        if (queued) return;
        queued = true;
        requestAnimationFrame(function () { queued = false; update(); });
      }, { passive: true });

      /* Work it out again when the row changes width (the panel opening, the
         window resizing) or the Text size setting changes (it's set on <html>) */
      function refit() { fit(); update(); }
      new ResizeObserver(refit).observe(scroller);
      window.addEventListener('resize', refit);   /* the window resized while the panel was closed */
      new MutationObserver(refit).observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });

      pager.hidden = false;
      refit();
    }

    /* infusion-uio.js loads with "defer", so wait until the page is parsed */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
