<!--
  Display preferences (Fluid Infusion UI Options): buttons in the header, next to
  the light/dark toggle, and a panel that opens just below the header.
  Included from header_custom.html. Styles and the Infusion script are loaded in
  head_custom.html; the layout is in _sass/custom/custom.scss (search for
  "Display preferences"). The Infusion files are in assets/infusion/.

  - Readers can change text size, font, line, letter and word spacing, colour
    contrast, and make buttons and form fields bigger. The choices apply to every
    page and are remembered in a browser cookie.
  - Infusion needs the buttons and the panel inside one container, so the script
    below wraps the whole header in that container and adds the panel after it.
    The header itself doesn't change.
  - On phones the header (search, these buttons, the light/dark toggle) is inside
    the menu, so readers open the menu to find "Show preferences".
  - The panels themselves (templates and wording) are only downloaded the first
    time someone opens the panel ("lazyLoad").
  - The buttons stay hidden if JavaScript is off, since they can't work without it.
  - Button wording: screen readers hear "Show preferences" / "Hide preferences"
    (without the + and −), which matches the visible words, so voice control
    ("click Show preferences", "click Reset") works.
-->
<div class="site-prefs-buttons" id="site-prefs-buttons" hidden>
  <button type="button" class="page-nav-button flc-slidingPanel-toggleButton">+ Show preferences</button>
  <button type="button" class="page-nav-button flc-prefsEditor-reset" aria-label="Reset preferences">Reset</button>
</div>

<script>
  (function () {
    function start() {
      var buttons = document.getElementById('site-prefs-buttons');
      var header = document.getElementById('main-header');
      if (!buttons || !header || !window.fluid || !fluid.uiOptions) return;

      /* Container: wraps the header, with the panel right after it */
      var prefs = document.createElement('div');
      prefs.id = 'site-prefs';
      prefs.className = 'site-prefs flc-prefsEditor-separatedPanel fl-prefsEditor-separatedPanel';
      var panel = document.createElement('div');
      panel.className = 'flc-slidingPanel-panel';

      header.parentNode.insertBefore(prefs, header);
      prefs.appendChild(header);
      prefs.appendChild(panel);
      buttons.hidden = false;

      fluid.uiOptions(prefs, {
        /* The panels, in order. Infusion also offers "fluid.prefs.tableOfContents",
           left out because every guide already has its own "On this page" list. */
        preferences: [
          "fluid.prefs.textSize",
          "fluid.prefs.textFont",
          "fluid.prefs.lineSpace",
          "fluid.prefs.letterSpace",
          "fluid.prefs.wordSpace",
          "fluid.prefs.contrast",
          "fluid.prefs.enhanceInputs"
        ],
        auxiliarySchema: {
          terms: {
            /* Paths include the site's address (/assistivetech), so they work on every page */
            templatePrefix: "{{ '/assets/infusion/src/framework/preferences/html' | relative_url }}",
            messagePrefix: "{{ '/assets/infusion/src/framework/preferences/messages' | relative_url }}"
          }
        },
        prefsEditorLoader: {
          lazyLoad: true,
          slidingPanel: {
            strings: {
              showText: "+ Show preferences",
              hideText: "− Hide preferences",
              showTextAriaLabel: "Show preferences",
              hideTextAriaLabel: "Hide preferences",
              panelLabel: "Display preferences"
            }
          }
        }
      });
    }

    /* infusion-uio.js loads with "defer", so wait until the page is parsed */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
