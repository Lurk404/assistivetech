<!--
  Display preferences (Fluid Infusion UI Options): a "Show preferences" button in
  the header, and a panel that opens just below the header. The top of the panel
  has the light/dark toggle (_includes/theme_toggle.html) and "Reset".
  Included from header_custom.html. Styles and the Infusion script are loaded in
  head_custom.html; the layout is in _sass/custom/custom.scss (search for
  "Display preferences"). The Infusion files are in assets/infusion/.

  - Readers can change text size, font, line, letter and word spacing, colour
    contrast, make buttons and form fields bigger, and turn on text-to-speech.
    The choices apply to every page and are remembered in a browser cookie.
  - Text-to-speech uses the voices built into the reader's browser. When it's on,
    a play button appears at the top of the page content and reads the page
    (the <main> element, not the menus or footer), and a small play button
    appears next to any text the reader selects. Collapsed sections are skipped
    until they're opened.
  - Infusion needs the buttons and the panel inside one container, so the script
    below wraps the whole header in that container and adds the panel after it.
    The header itself doesn't change.
  - On phones the header (search, these buttons, the light/dark toggle) is inside
    the menu, so readers open the menu to find "Show preferences".
  - The panels themselves (templates and wording) are only downloaded the first
    time someone opens the panel ("lazyLoad").
  - The buttons stay hidden if JavaScript is off, since they can't work without it.
  - Button wording: screen readers hear "Show preferences" / "Hide preferences"
    (without the + and −), which matches the visible words, so voice control
    ("click Show preferences", "click Reset") works.
-->
<div class="site-prefs-buttons" id="site-prefs-buttons" hidden>
  <button type="button" class="page-nav-button flc-slidingPanel-toggleButton">+ Show preferences</button>
</div>

<!-- Hidden until the script below moves it into the top of the panel -->
<div class="site-prefs-toolbar" id="site-prefs-toolbar" hidden>
  {% include theme_toggle.html %}
  <button type="button" class="page-nav-button flc-prefsEditor-reset" aria-label="Reset preferences">Reset</button>
</div>

<script>
  (function () {
    function start() {
      var buttons = document.getElementById('site-prefs-buttons');
      var toolbar = document.getElementById('site-prefs-toolbar');
      var header = document.getElementById('main-header');
      if (!buttons || !toolbar || !header || !window.fluid || !fluid.uiOptions) {
        /* Infusion didn't load: leave the light/dark toggle in the header,
           and remove "Reset", which can't work without Infusion */
        var reset = toolbar && toolbar.querySelector('.flc-prefsEditor-reset');
        if (reset) reset.remove();
        if (toolbar) toolbar.hidden = false;
        return;
      }

      /* Container: wraps the header, with the panel right after it */
      var prefs = document.createElement('div');
      prefs.id = 'site-prefs';
      prefs.className = 'site-prefs flc-prefsEditor-separatedPanel fl-prefsEditor-separatedPanel';
      var panel = document.createElement('div');
      panel.className = 'flc-slidingPanel-panel';
            /* Start closed. Infusion closes the panel when it starts, but with a
         sliding animation, a moment after the page appears, so without this
         the open panel would flash on screen and then slide shut. */
      panel.style.display = 'none';

      header.parentNode.insertBefore(prefs, header);
      prefs.appendChild(header);
      prefs.appendChild(panel);
      /* Light/dark and Reset go at the top of the panel. Infusion adds the
         preference cards after them when the panel first opens. */
      panel.appendChild(toolbar);
      toolbar.hidden = false;
      buttons.hidden = false;

      /* Tab order: on wider screens, put the header (search, Show preferences,
         View on GitHub) before the sidebar in the page, so keyboard
         users reach it before the menu. It looks the same: the sidebar is fixed
         to the left there, and custom.scss lines the header up with the content.
         On phones it stays where Just the Docs puts it, inside the menu.
         (50rem matches Just the Docs' "md" breakpoint.) */
      var sidebar = document.querySelector('.side-bar');
      var mainCol = document.querySelector('.main');
      var wide = window.matchMedia('(min-width: 50rem)');
      function place() {
        if (wide.matches && sidebar) {
          document.body.insertBefore(prefs, sidebar);
          prefs.classList.add('site-prefs-top');
        } else if (mainCol) {
          mainCol.insertBefore(prefs, mainCol.firstChild);
          prefs.classList.remove('site-prefs-top');
        }
      }
      place();
      if (wide.addEventListener) wide.addEventListener('change', place);

      /* Text-to-speech: read the page's <main>, and put the play button
         at the top of the page content */
      var content = document.querySelector('.main-content');
      var main = document.querySelector('.main-content main');
      if (content && main) {
        content.classList.add('flc-prefs-selfVoicingWidget');
        main.classList.add('flc-orator-content');
      }

      /* Extra contrast theme: dark brown on sand (#F9F5E9), second in the list.
         Its colours are in custom.scss (search for "fl-theme-sand"), and its name
         ("Dark brown on sand") is in assets/display-preferences/contrast.json. */
      fluid.defaults("fluid.prefs.schemas.contrast", {
        gradeNames: ["fluid.prefs.schemas"],
        schema: {
          "fluid.prefs.contrast": {
            "type": "string",
            "default": "default",
            "enum": ["default", "sand", "bw", "wb", "by", "yb", "lgdg", "gw", "gd", "bbr"],
            "enumLabels": ["contrast-default", "contrast-sand", "contrast-bw", "contrast-wb",
              "contrast-by", "contrast-yb", "contrast-lgdg", "contrast-gw", "contrast-gd", "contrast-bbr"]
          }
        }
      });

      fluid.uiOptions(prefs, {
        /* The panels, in order. Infusion also offers "fluid.prefs.tableOfContents",
           left out because every guide already has its own "On this page" list. */
        preferences: [
          "fluid.prefs.textSize",
          "fluid.prefs.textFont",
          "fluid.prefs.lineSpace",
          "fluid.prefs.letterSpace",
          "fluid.prefs.wordSpace",
          "fluid.prefs.contrast",
          "fluid.prefs.enhanceInputs",
          "fluid.prefs.speak"
        ],
        auxiliarySchema: {
          terms: {
            /* Paths include the site's address (/assistivetech), so they work on every page */
            templatePrefix: "{{ '/assets/infusion/src/framework/preferences/html' | relative_url }}",
            messagePrefix: "{{ '/assets/infusion/src/framework/preferences/messages' | relative_url }}"
          },
          /* The sand theme (see above): its class, and the wording file with its name */
          "fluid.prefs.contrast": {
            enactor: {
              classes: { "sand": "fl-theme-sand" }
            },
            panel: {
              classnameMap: { theme: { "sand": "fl-theme-sand" } },
              message: "{{ '/assets/display-preferences/contrast.json' | relative_url }}"
            }
          },
          /* Text-to-speech play button: clearer names than Infusion's "play" / "pause" */
          "fluid.prefs.speak": {
            enactor: {
              orator: {
                controller: {
                  strings: { play: "Read this page aloud", pause: "Pause reading" }
                }
              }
            }
          }
        },
        prefsEditorLoader: {
          lazyLoad: true,
          slidingPanel: {
            strings: {
              showText: "+ Show preferences",
              hideText: "− Hide preferences",
              showTextAriaLabel: "Show preferences",
              hideTextAriaLabel: "Hide preferences",
              panelLabel: "Display preferences"
            }
          }
        }
      });
    }

    /* infusion-uio.js loads with "defer", so wait until the page is parsed */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
