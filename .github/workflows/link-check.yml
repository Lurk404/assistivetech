# Checks every link in the guides once a month and opens an issue listing any
# broken ones. To run it now: Actions tab > Check links > Run workflow.
name: Check links

on:
  schedule:
    - cron: "0 15 1 * *"   # 1st of every month, 15:00 UTC (8 am Pacific)
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  issues: write             # lets the workflow open an issue

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Pages to check. 403 and 429 count as OK: some sites block or
          # rate-limit link checkers even though the page works for people.
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            'index.md' 'about/*.md' 'guides/*.md'
          fail: false

      - name: Open an issue if any links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: broken links
