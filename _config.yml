title: AT User Guides
description: Explore this collection of assistive technology user guides to learn new strategies, discover tips, and enhance your digital experience.

# Theme: Just the Docs, pinned to a release so updates don't change the site unexpectedly
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Files that stay in the repository but are not part of the website
exclude:
  - README.md
  - LICENSE

# Search box at the top of every page (Ctrl+K / Command+K jumps to it)
search_enabled: true
search:
  focus_shortcut_key: "k"

# Page features
heading_anchors: true
back_to_top: false   # replaced by the floating buttons in _includes/page_nav_buttons.html

# Link in the top right corner of every page
aux_links:
  "View on GitHub":
    - "https://github.com/Lurk404/assistivetech"
  aux_links_new_tab: true

# Callout boxes for the website. In a page, put {: .tip } (or .note, .warning,
# .langara) on the line directly above a paragraph. In the GitHub repo view, the
# {: .tip } line shows up as plain text. If you add a callout, also add it to
# $callouts in _sass/custom/custom.scss, which sets its dark mode colour.
callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  langara:
    title: At Langara
    color: purple

# Colour scheme: "light" (the default). The Light/Dark button switches to "dark".
color_scheme: light
