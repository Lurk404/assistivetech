# One entry for each tool or feature section in the guides. The "Browse by"
# pages (browse/devices/ and browse/software/) are built from this file.
#
# Fields:
#   name       What the tool or feature is called.
#   guide      The guide's file name, without guides/ or .md.
#   anchor     The id of the heading or collapsed section in that guide to link to.
#              "" links to the top of the page.
#   tags       The same labels the guide shows under the heading (see availability.yml).
#              scripts/check_tools.py compares them with the guide.
#   platforms  The system a tool is built into or made for, so it appears on that
#              device's page. Keys are in browse.yml. List it for:
#                - built-in features (TalkBack, Windows Voice Access, Live Text)
#                - software that only runs on that system (JAWS, ZoomText, Dragon)
#              Built-in features that exist on several Apple or Google systems list
#              each one (VoiceOver is macos and ios).
#              Leave it out for software that runs on several systems (Speechify,
#              Chrome, Word Dictate, GitMind) and for web apps, so it isn't on any
#              device page. It still appears in its guide, and on a software page
#              if it has "products".
#   products   Software this belongs to, if it has a page in browse/software/.
#   summary    One plain sentence about what it does. Optional.
#
# Keep entries in the same order as the guides in the menu. Each guide's entries
# are grouped together on the Browse by pages in the order they appear here.
#
# After changing a guide's headings, run: python3 scripts/check_tools.py

